version: 2
updates:
  # Python dependencies (requirements*.txt): one grouped PR per week for routine updates
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-routine:
        update-types: ["minor", "patch"]

  # The versions of the GitHub Actions used by the workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
